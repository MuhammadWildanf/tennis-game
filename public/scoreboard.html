<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboards — Tennis Challenge</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="event.css" />
  <style>
    /* bola di depan card khusus leaderboard */
    .ev-footwave {
      z-index: 3;
    }

    /* header kompak khusus leaderboard ala Figma */
    .ev-title.sb-title-img {
      width: 88%;
      margin: 0 auto;
    }

    .ev-logo.sb-logo-img {
      width: 150px;
    }

    /* halaman fix tanpa scroll: scroll hanya di dalam card */
    .ev-app {
      height: 100vh;
      height: 100svh;
      max-height: 100vh;
      max-height: 100svh;
      overflow: hidden;
    }

    section.lb-plain {
      margin-top: 0 !important;
      margin-bottom: auto !important;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .ev-card.lb-plain {
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
    }

    /* bola kanan khusus leaderboard ala Figma */
    .ev-footwave img {
      object-position: right bottom;
      transform: translate(35%, 45%);
    }

    .lb-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 2px 2px 12px;
    }

    .lb-title-row h2 {
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .lb-title-row .trophy {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1.5px solid rgba(255, 255, 255, .7);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex: none;
    }

    .lb-panel {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 24px;
      padding: 18px 18px 34px;
      box-shadow: 0 18px 50px rgba(2, 12, 40, 0.35);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .lb-back {
      position: relative;
      z-index: 2;
      margin: -26px 0 0 2px;
    }

    .sb-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      padding: 0 14px 0 0;
      margin: 0;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: #d7f75b rgba(255, 255, 255, 0.22);
    }

    .sb-list::-webkit-scrollbar {
      width: 8px;
    }

    .sb-list::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.22);
      border-radius: 4px;
    }

    .sb-list::-webkit-scrollbar-thumb {
      background: #d7f75b;
      border-radius: 4px;
    }

    .sb-row {
      flex: none;
      display: grid;
      grid-template-columns: 30px 1fr auto;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      padding: 9px 2px;
      color: #fff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.16);
    }

    .sb-row .rnk {
      color: #d7f75b;
      font-weight: 800;
      font-size: 16px;
      text-align: center;
    }

    .sb-row .name {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .sb-row .score {
      font-size: 16px;
      font-weight: 800;
      color: #d7f75b;
      white-space: nowrap;
      border-left: 1px solid rgba(255, 255, 255, 0.35);
      padding-left: 14px;
    }

    .sb-row.you {
      background: #F2F6FF;
      border: none;
      clip-path: none;
      border-radius: 14px;
    }

    .sb-row.you .rnk,
    .sb-row.you .name,
    .sb-row.you .score {
      color: #053469;
      font-weight: 900;
    }

    .sb-row.you .score {
      border-left-color: rgba(5, 52, 105, 0.3);
    }

    .sb-row.top1 {
      background: #d7f75b;
      border: none;
      clip-path: none;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(215, 247, 91, 0.35);
    }

    .sb-row.top1 .rnk,
    .sb-row.top1 .name,
    .sb-row.top1 .score {
      color: #053469;
      font-weight: 900;
    }

    .sb-row.top1 .score {
      border-left-color: rgba(5, 52, 105, 0.35);
    }

    .sb-empty {
      text-align: center;
      color: #fff;
      font-size: 15px;
      padding: 14px 0;
    }

    /* List sampai 20: rapat + ramping di layar kecil */
    @media (max-width: 360px) {

      .sb-row .name,
      .sb-row .score {
        font-size: 15px;
      }
    }
  </style>
</head>

<body class="ev-body">
  <div class="ev-footwave" aria-hidden="true"><img src="assets/image/bola.png" alt="" /></div>

  <main class="app ev-app">
    <header>
      <p class="ev-eyebrow">WEALTH SYMPOSIUM</p>
      <img class="ev-title sb-title-img" src="assets/image/title.png" alt="Tennis Challenge" />
      <img class="ev-logo sb-logo-img" src="assets/image/logo.png" alt="Citi | Mastercard" />
    </header>

    <!-- Halaman 3: leaderboard Top 20 -->
    <section class="ev-card lb-plain">
      <div class="lb-panel">
        <div class="lb-title-row">
          <h2>TOP 20 LEADERBOARD</h2><span class="trophy">🏆</span>
        </div>
        <div id="sb-empty" class="sb-empty hidden">
          <p>No scores yet — be the first on the board!</p>
        </div>
        <ul id="sb-list" class="sb-list"></ul>
      </div>
    </section>
  </main>

  <script>
    'use strict';
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const me = localStorage.getItem('ct_user') || null;

    async function tick() {
      try {
        const lb = await (await fetch('/api/leaderboard?sort=best_score&limit=20')).json();
        let rows = lb;
        // Di luar top 20: nama sendiri tetap tampil di bawah tanpa ranking
        if (me && !lb.some((p) => p.username === me)) {
          try {
            const token = localStorage.getItem('ct_token');
            const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
            const pr = await (await fetch('/api/profile', { headers })).json();
            if (pr && pr.username) rows = [...lb, { rank: null, username: pr.username, display_name: pr.display_name, best_score: pr.best_score || 0 }];
          } catch (_) { }
        }
        $('#sb-empty').classList.toggle('hidden', rows.length > 0);
        $('#sb-list').innerHTML = rows.map((p) =>
          `<li class="sb-row${p.rank === 1 ? ' top1' : ''}${me && p.username === me ? ' you' : ''}">` +
          `<span class="rnk">${p.rank ?? '–'}</span>` +
          `<span class="name">${esc(p.display_name || p.username)}</span>` +
          `<span class="score">${p.best_score}</span></li>`
        ).join('');
      } catch (_) { }
    }
    tick();
    setInterval(() => { if (!document.hidden) tick(); }, 15000);
  </script>
</body>

</html>
