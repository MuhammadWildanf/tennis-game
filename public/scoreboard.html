<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboards — Tennis Challenge</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="event.css" />
  <style>
    .ev-card.lb-plain { background: transparent; border: none; box-shadow: none; padding: 0; }
    .lb-title {
      font-style: italic; font-weight: 900; font-size: 42px; line-height: 1;
      text-align: center; letter-spacing: .01em;
      background: linear-gradient(180deg, #ffffff 25%, #bfe9ff 50%, #37a4f2 72%, #e8f7ff 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      filter: drop-shadow(0 2px 0 #0a2a6e) drop-shadow(0 5px 10px rgba(0,0,0,.55));
      margin-bottom: 6px;
    }
    .lb-sub {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      color: #d6e9ff; font-weight: 800; font-size: 12px; letter-spacing: .32em; text-indent: .32em;
      margin-bottom: 14px;
    }
    .lb-sub::before, .lb-sub::after {
      content: ''; height: 2px; width: 60px; border-radius: 2px;
      background: linear-gradient(90deg, transparent, #5eb6ff);
    }
    .lb-sub::after { background: linear-gradient(90deg, #5eb6ff, transparent); }
    .lb-panel {
      background: linear-gradient(180deg, rgba(10,34,88,.88), rgba(4,16,48,.92));
      border: 1.5px solid rgba(90,175,255,.55); border-radius: 22px;
      padding: 14px 12px;
      box-shadow: 0 0 26px rgba(60,140,255,.35), inset 0 0 34px rgba(30,90,200,.16);
    }
    .sb-list { list-style: none; display: flex; flex-direction: column; gap: 7px; }
    .sb-row {
      display: grid; grid-template-columns: 46px 1fr auto; align-items: center;
      background: linear-gradient(180deg, rgba(22,64,136,.55), rgba(8,26,66,.65));
      border: 1px solid rgba(90,170,255,.38); border-radius: 12px;
      padding: 5px 14px 5px 5px; color: #fff;
      position: relative; overflow: hidden;
    }
    .sb-row::after {
      content: ''; position: absolute; top: 0; bottom: 0; right: 9%; width: 30px;
      background: linear-gradient(105deg, transparent, rgba(130,195,255,.16), transparent);
      transform: skewX(-20deg); pointer-events: none;
    }
    .sb-badge {
      width: 38px; height: 38px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 17px; color: #fff;
      background: rgba(70,140,230,.28); border: 1px solid rgba(120,190,255,.5);
    }
    .sb-row.top1 { border-color: #ffc93c; box-shadow: 0 0 14px rgba(255,200,60,.55), inset 0 0 18px rgba(255,190,40,.14); }
    .sb-row.top1 .sb-badge { background: linear-gradient(180deg, #ffe27a, #f5a623); border-color: #ffedb5; color: #5a3400; font-size: 20px; }
    .sb-row.top2 .sb-badge { background: linear-gradient(180deg, #f2f5f9, #9aa7b8); border-color: #e2e8f0; color: #33404f; }
    .sb-row.top3 .sb-badge { background: linear-gradient(180deg, #ffc48a, #c96a1e); border-color: #ffd9ab; color: #4d2400; }
    .sb-row .rank { display: none; }
    .sb-row .name {
      font-size: 17px; font-weight: 800; letter-spacing: .02em; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 10px;
    }
    .sb-row .score { font-size: 17px; font-weight: 800; color: #ffd75e; padding-left: 10px; white-space: nowrap; }
    .sb-row .score::after { content: ' PTS'; font-size: 12px; }
    .sb-row.you { box-shadow: 0 0 0 2px #7cc4ff; }
    .sb-empty { text-align: center; color: #fff; font-size: 15px; padding: 14px 0; }
    .sb-note { text-align: center; font-size: 11px; color: rgba(255,255,255,.6); margin-top: 12px; letter-spacing: .08em; }
    /* List sampai 20: rapat + ramping di layar kecil */
    @media (max-width: 360px) {
      .lb-title { font-size: 34px; }
      .sb-row { grid-template-columns: 40px 1fr auto; padding: 4px 10px 4px 4px; }
      .sb-badge { width: 32px; height: 32px; font-size: 15px; border-radius: 8px; }
      .sb-row .name, .sb-row .score { font-size: 15px; }
    }
  </style>
</head>
<body class="ev-body">
  <div class="ev-veil" aria-hidden="true"></div>
  <div class="ev-footwave" aria-hidden="true"><img src="assets/image/footer-wave.png" alt="" /></div>

  <main class="app ev-app">
    <!-- Halaman 3: leaderboard Top 20 (tanpa hero, langsung isi) -->
    <section class="ev-card lb-plain">
      <div class="lb-title">LEADERBOARD</div>
      <div class="lb-sub">TOP 20 PLAYERS</div>
      <div class="lb-panel">
        <div id="sb-empty" class="sb-empty hidden"><p>No scores yet — be the first on the board!</p></div>
        <ul id="sb-list" class="sb-list"></ul>
      </div>
      <p class="sb-note">LIVE · <span id="sb-upd"></span></p>
    </section>
  </main>

  <script>
    'use strict';
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const me = localStorage.getItem('ct_user') || null;

    async function tick() {
      try {
        const lb = await (await fetch('/api/leaderboard?sort=best_score&limit=20')).json();
        let rows = lb;
        // Di luar top 20: nama sendiri tetap tampil di bawah tanpa ranking
        if (me && !lb.some((p) => p.username === me)) {
          try {
            const token = localStorage.getItem('ct_token');
            const headers = token ? { 'Authorization': 'Bearer ' + token } : {};
            const pr = await (await fetch('/api/profile', { headers })).json();
            if (pr && pr.username) rows = [...lb, { rank: null, username: pr.username, display_name: pr.display_name, best_score: pr.best_score || 0 }];
          } catch (_) {}
        }
        $('#sb-empty').classList.toggle('hidden', rows.length > 0);
        $('#sb-list').innerHTML = rows.map((p) => {
          const cls = p.rank === 1 ? ' top1' : p.rank === 2 ? ' top2' : p.rank === 3 ? ' top3' : '';
          const badge = p.rank === 1 ? '🏆' : (p.rank ?? '–');
          return `<li class="sb-row${cls}${me && p.username === me ? ' you' : ''}">` +
          `<span class="sb-badge">${badge}</span>` +
          `<span class="name">${esc(p.display_name || p.username)}</span>` +
          `<span class="score">${p.best_score}</span></li>`;
        }).join('');
        $('#sb-upd').textContent = 'updated ' + new Date().toLocaleTimeString();
      } catch (_) {}
    }
    tick();
    setInterval(() => { if (!document.hidden) tick(); }, 15000);
  </script>
</body>
</html>
