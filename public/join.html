<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tennis Challenge — Citi Wealth Symposium</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="event.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .queue-msg {
      font-family: 'Astonpoliz', sans-serif;
      text-align: center; color: #fff;
      font-size: 17px; letter-spacing: .06em; margin-top: 18px; line-height: 1.5;
    }
    .queue-msg.big { font-family: 'Basenji', sans-serif; font-size: 30px; letter-spacing: .02em; }
    .queue-name { margin-top: 18px; }
    .mini-links { text-align: center; margin-top: 16px; }
    .mini-links button {
      background: none; border: none; cursor: pointer; font-family: 'Astonpoliz', sans-serif;
      color: rgba(255,255,255,.85); font-size: 14px; letter-spacing: .08em;
      text-decoration: none; margin: 0 8px;
    }
  </style>
</head>
<body class="ev-body">
  <div class="ev-veil" aria-hidden="true"></div>
  <div class="ev-footwave" aria-hidden="true"><img src="assets/image/footer-wave.png" alt="" /></div>

  <main class="app ev-app">
    <header>
      <p class="ev-symposium">CITI WEALTH SYMPOSIUM</p>
      <img class="ev-title" src="assets/image/title.png" alt="Tennis Challenge" />
      <p class="ev-tagline">PLAY <i>•</i> COMPETE <i>•</i> CONNECT</p>
      <img class="ev-logo" src="assets/image/logo.png" alt="Citi | Mastercard" />
    </header>

    <!-- State 1: isi alias dulu -->
    <section id="alias-wrap" class="ev-card hidden">
      <h2>ENTER<br />YOUR ALIAS</h2>
      <form id="join-alias-form" novalidate>
        <input type="text" class="ev-pill" id="join-alias-input" placeholder="Nickname" maxlength="12"
               autocomplete="off" autocapitalize="characters" spellcheck="false" />
        <p class="ev-hint">use 2 – 12 characters ( A-Z , 0-9 )</p>
        <p id="join-alias-error" class="form-error"></p>
        <button type="submit" class="ev-btn" id="join-ready-btn">
          <span class="btn-label">LET'S PLAY !</span>
          <span class="btn-spinner"></span>
        </button>
      </form>
    </section>

    <!-- State 2: sudah daftar, belum masuk antrian -->
    <section id="join-idle" class="ev-card hidden">
      <h2>READY TO<br />PLAY?</h2>
      <p class="ev-hint" id="join-who"></p>
      <button class="ev-btn" id="join-btn" onclick="joinQueue()">
        <span class="btn-label">JOIN ✓</span>
        <span class="btn-spinner"></span>
      </button>
      <div class="mini-links"><button onclick="switchAlias()">Use different alias</button></div>
    </section>

    <!-- State 3: dalam antrian -->
    <section id="join-status" class="ev-card hidden">
      <h2 id="queue-title">GET READY...</h2>
      <div class="ev-pill queue-name" id="queue-name">–</div>
      <p class="queue-msg" id="queue-msg">Please wait…</p>
      <button class="ev-btn" id="ready-btn" onclick="tryReady()" style="margin-top:14px;">
        <span class="btn-label">PLAY</span>
      </button>
      <div class="mini-links"><button onclick="leaveQueue()">Leave</button></div>
    </section>

    <!-- State 4: selesai main -->
    <section id="join-done" class="ev-card hidden">
      <h2>THANKS FOR<br />PLAYING!</h2>
      <p class="ev-hint">Your score is on the leaderboard.</p>
      <button class="ev-btn" id="again-btn" onclick="joinQueue()">
        <span class="btn-label">PLAY AGAIN ✓</span>
        <span class="btn-spinner"></span>
      </button>
      <div class="mini-links"><button onclick="switchAlias()">Use different alias</button></div>
      <nav class="ev-links"><a href="/scoreboard">LEADERBOARDS →</a></nav>
    </section>

    <nav class="ev-links">
      <a href="/">← ALIAS</a>
      <a href="/scoreboard">LEADERBOARDS →</a>
    </nav>
  </main>

  <div id="toast" class="toast hidden"><span id="toast-text"></span></div>

  <script>
    'use strict';
    const $ = (s) => document.querySelector(s);
    let authToken = localStorage.getItem('ct_token') || null;
    let pollTimer = null;

    async function api(path, options = {}) {
      const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
      if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
      const res = await fetch(path, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }
    function toast(t) {
      Swal.fire({ icon:'info', title: t, confirmButtonColor:'#0a2a6e', timer: 2500, showConfirmButton:false });
    }
    function loading(btn, on) {
      if (!btn.dataset.label) btn.dataset.label = btn.querySelector('.btn-label').textContent;
      btn.querySelector('.btn-label').textContent = on ? '' : btn.dataset.label;
      btn.querySelector('.btn-spinner').style.display = on ? 'inline-block' : 'none';
      btn.disabled = on;
    }
    function hideAll() {
      for (const id of ['#alias-wrap', '#join-idle', '#join-status', '#join-done']) $(id).classList.add('hidden');
      clearInterval(pollTimer);
    }
    function show(id) {
      hideAll();
      $(id).classList.remove('hidden');
    }

    const aliasInput = $('#join-alias-input');
    aliasInput.addEventListener('input', () => {
      const clean = aliasInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
      if (clean !== aliasInput.value) aliasInput.value = clean;
    });

    $('#join-alias-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alias = aliasInput.value.trim().toUpperCase();
      const errEl = $('#join-alias-error');
      errEl.classList.remove('show');
      if (alias.length < 2) { errEl.textContent = 'Alias must be 2–12 characters.'; errEl.classList.add('show'); return; }
      const btn = $('#join-ready-btn');
      loading(btn, true);
      try {
        const data = await api('/api/signup', { method: 'POST', body: JSON.stringify({ username: alias }) });
        authToken = data.token;
        localStorage.setItem('ct_token', authToken);
        localStorage.setItem('ct_user', data.user.username);
        await joinQueue();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.add('show');
      } finally {
        loading(btn, false);
      }
    });

    async function joinQueue() {
      const btns = [$('#join-btn'), $('#again-btn')].filter(Boolean);
      btns.forEach((b) => loading(b, true));
      try {
        const data = await api('/api/queue/join', { method: 'POST' });
        show('#join-status');
        pollTimer = setInterval(refreshStatus, 3000);
        await refreshStatus();
        toast(`You are in! 🎾`);
      } catch (err) {
        toast(err.message);
      } finally {
        loading($('#join-btn'), false);
        loading($('#again-btn'), false);
      }
    }

    async function refreshStatus() {
      try {
        const s = await api('/api/queue/my-status');
        if (!s.in_queue) {
          if (s.finished) show('#join-done'); else showIdle();
          return;
        }
        show('#join-status');
        pollTimer = pollTimer || setInterval(refreshStatus, 3000);
        const title = $('#queue-title');
        const msg = $('#queue-msg');
        $('#queue-name').textContent = (localStorage.getItem('ct_user') || '').toUpperCase() || '–';
        const readyBtn = $('#ready-btn');
        if (s.status === 'current') {
          title.innerHTML = 'YOUR TURN!';
          msg.textContent = 'Get ready… your game will start soon! 🎾';
          msg.classList.add('big');
          if (readyBtn) readyBtn.style.display = 'none';
          if (!window._selectedPopupShown) {
            window._selectedPopupShown = true;
            Swal.fire({ icon: 'success', title: 'You have been selected!', text: 'Get ready to play! 🎾', confirmButtonColor: '#0a2a6e' });
          }
        } else {
          window._selectedPopupShown = false;
          // Saat ada yang main: sembunyikan tombol PLAY biar tidak bingung,
          // tampilkan siapa yang sedang main. Saat idle: tampilkan PLAY.
          try {
            const st = await api('/api/queue/state');
            const isPlaying = !!st.current;
            if (isPlaying) {
              const who = st.current.display_name || st.current.username;
              title.innerHTML = 'GAME IN PROGRESS';
              msg.classList.remove('big');
              msg.textContent = `${who} is playing… please wait.`;
              if (readyBtn) readyBtn.style.display = 'none';
            } else {
              title.innerHTML = 'GET READY...';
              msg.classList.remove('big');
              msg.textContent = 'Tap PLAY when ready…';
              if (readyBtn) { readyBtn.style.display = ''; readyBtn.disabled = false; readyBtn.style.opacity = '1'; readyBtn.style.pointerEvents = 'auto'; }
            }
            if (st.current && !window._waitingPopupShown) {
              window._waitingPopupShown = true;
              Swal.fire({ icon: 'info', title: 'Please wait', text: `${st.current.username} has been selected — please wait until the game finishes.`, confirmButtonColor: '#0a2a6e' });
            }
            if (!st.current) window._waitingPopupShown = false;
          } catch (_) {}
        }
      } catch (_) {}
    }

    async function showIdle() {
      try {
        const me = await api('/api/profile');
        localStorage.setItem('ct_user', me.username);
        $('#join-who').textContent = `Playing as ${me.username} — tap below to line up.`;
        $('#queue-name').textContent = me.username;
      } catch (_) {}
      show('#join-idle');
    }

    async function tryReady() {
      try {
        const r = await api('/api/queue/compete', { method:'POST' });
        if (r.reason === 'playing') {
          Swal.fire({ icon: 'info', title: 'Please wait', text: `A player has been selected — please wait until the game finishes.`, confirmButtonColor: '#0a2a6e' });
          return;
        }
        if (r.winner) {
          Swal.fire({ icon: 'success', title: 'You have been selected!', text: 'Get ready to play! 🎾', confirmButtonColor: '#0a2a6e' });
        } else {
          Swal.fire({ icon: 'info', title: 'Please wait', text: `${r.winner_username} has been selected — please wait until the game finishes.`, confirmButtonColor: '#0a2a6e' });
        }
      } catch (e) {
        const msg = (e.message && e.message !== 'Request failed') ? e.message : 'A player has been selected — please wait until the game finishes.';
        Swal.fire({ icon: 'info', title: 'Please wait', text: msg, confirmButtonColor: '#0a2a6e' });
      }
    }

    async function leaveQueue() {
      try { await api('/api/queue/leave', { method: 'POST' }); } catch (_) {}
      clearInterval(pollTimer);
      location.href = '/';
    }
    function switchAlias() {
      authToken = null;
      localStorage.removeItem('ct_token');
      show('#alias-wrap');
      aliasInput.focus();
    }

    (async function boot() {
      if (!authToken) { show('#alias-wrap'); return; }
      try {
        const s = await api('/api/queue/my-status');
        if (s.in_queue) {
          show('#join-status');
          pollTimer = setInterval(refreshStatus, 3000);
          await refreshStatus();
        } else if (s.finished) {
          show('#join-done');
        } else {
          showIdle();
        }
      } catch (_) {
        authToken = null;
        localStorage.removeItem('ct_token');
        show('#alias-wrap');
      }
    })();
  </script>
</body>
</html>
