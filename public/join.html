<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tennis Challenge — Citi Wealth Symposium</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="event.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    #join-idle {
      margin-top: 18px;
    }

    #join-alias-error {
      margin-bottom: 12px;
    }

    #idle-note {
      margin: 0 0 10px;
    }

    #idle-note:empty {
      display: none;
    }

    .queue-msg {
      font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      text-align: center;
      color: #fff;
      font-size: 17px;
      letter-spacing: .06em;
      margin-top: 18px;
      line-height: 1.5;
    }

    .queue-msg.big {
      font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 30px;
      letter-spacing: .02em;
    }

    .queue-name {
      margin-top: 18px;
    }

    .mini-links {
      text-align: center;
      margin-top: 16px;
    }

    .mini-links button {
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: rgba(255, 255, 255, .85);
      font-size: 14px;
      letter-spacing: .08em;
      text-decoration: none;
      margin: 0 8px;
    }
  </style>
</head>

<body class="ev-body">
  <div class="ev-footwave" aria-hidden="true"><img src="assets/image/bola.png" alt="" /></div>

  <main class="app ev-app">
    <header>
      <img class="ev-title" src="assets/image/logo-group.png" alt="Tennis Challenge" />
    </header>

    <!-- State 1: isi nickname dulu -->
    <section id="alias-wrap" class="ev-card hidden">
      <h2>Enter your nickname</h2>
      <p id="join-alias-error" class="form-error" style="text-align:center"></p>
      <form id="join-alias-form" novalidate>
        <input type="text" class="ev-pill" id="join-alias-input" placeholder="Nickname" maxlength="12"
          autocomplete="off" autocapitalize="characters" spellcheck="false" />
        <p class="ev-hint">Use 2-12 Characters (A-Z, 0-9)</p>
        <button type="submit" class="ev-btn ev-btn-lime" id="join-ready-btn">
          <span class="btn-label">Submit <span class="btn-arrow">→</span></span>
          <span class="btn-spinner"></span>
        </button>
      </form>
    </section>

    <!-- State 2: Welcome + nama + READY -->
    <section id="join-idle" class="ev-card hidden">
      <div class="ball-mini"><img src="assets/image/bola.png" alt="" /></div>
      <p id="idle-note" class="form-error" style="text-align:center"></p>
      <h2 id="join-welcome">Welcome!</h2>
      <p class="ev-hint">Press READY to play!</p>
      <button class="ev-btn ev-btn-play" id="join-btn" onclick="readyToPlay()">
        <span class="btn-label">READY<span class="btn-arrow">→</span></span>
        <span class="btn-spinner"></span>
      </button>
    </section>

    <!-- State 3: dalam antrian -->
    <section id="join-status" class="ev-card hidden">
      <h2 id="queue-title">ARE YOU READY?</h2>
      <div class="ev-pill queue-name" id="queue-name">–</div>
      <p class="queue-msg" id="queue-msg">Please wait</p>
    </section>
  </main>

  <div id="toast" class="toast hidden"><span id="toast-text"></span></div>

  <script>
    'use strict';
    const $ = (s) => document.querySelector(s);
    let authToken = localStorage.getItem('ct_token') || null;
    let pollTimer = null;

    async function api(path, options = {}) {
      const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
      if (authToken) headers['Authorization'] = `Bearer ${authToken}`;
      const res = await fetch(path, { ...options, headers });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) { const e = new Error(data.error || 'Request failed'); e.status = res.status; e.reason = data.reason; throw e; }
      return data;
    }
    function toast(t) {
      Swal.fire({ icon: 'info', title: t, confirmButtonColor: '#0a2a6e', timer: 2500, showConfirmButton: false });
    }
    function loading(btn, on) {
      if (!btn.dataset.label) btn.dataset.label = btn.querySelector('.btn-label').textContent;
      btn.querySelector('.btn-label').textContent = on ? '' : btn.dataset.label;
      btn.querySelector('.btn-spinner').style.display = on ? 'inline-block' : 'none';
      btn.disabled = on;
    }
    function hideAll() {
      for (const id of ['#alias-wrap', '#join-idle', '#join-status']) $(id).classList.add('hidden');
      clearInterval(pollTimer);
      pollTimer = null;
    }
    function show(id) {
      hideAll();
      $(id).classList.remove('hidden');
    }

    const aliasInput = $('#join-alias-input');
    aliasInput.addEventListener('input', () => {
      const clean = aliasInput.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12);
      if (clean !== aliasInput.value) aliasInput.value = clean;
    });

    $('#join-alias-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alias = aliasInput.value.trim().toUpperCase();
      const errEl = $('#join-alias-error');
      errEl.classList.remove('show');
      if (alias.length < 2) { errEl.textContent = 'Nickname must be 2–12 characters.'; errEl.classList.add('show'); return; }
      const btn = $('#join-ready-btn');
      loading(btn, true);
      try {
        const data = await api('/api/signup', { method: 'POST', body: JSON.stringify({ username: alias }) });
        authToken = data.token;
        localStorage.setItem('ct_token', authToken);
        localStorage.setItem('ct_user', data.user.username);
        await showIdle();
      } catch (err) {
        if (/taken/i.test(err.message || '') && alias === (localStorage.getItem('ct_user') || '')) {
          // Nama sendiri: pastikan token simpanan masih hidup dulu.
          // Kalau mati (mis. sesi lama), jangan lanjut — nanti READY 401 "Authentication required".
          try { await api('/api/profile'); await showIdle(); }
          catch (_) {
            authToken = null; localStorage.removeItem('ct_token');
            errEl.textContent = 'Session expired and nickname is taken. Try another nickname.';
            errEl.classList.add('show');
          }
        } else {
          errEl.textContent = /taken/i.test(err.message || '') ? 'Nickname already taken, please enter a new nickname' : err.message;
          errEl.classList.add('show');
          aliasInput.focus();
        }
      } finally {
        loading(btn, false);
      }
    });

    // Flowchart: READY -> cek status game dulu. Sibuk = catatan try-later
    // di halaman (tidak masuk antrian). Idle = join + pesan arena di halaman.
    // + MODE LEADERBOARD (dari admin): READY dikunci total, Unity tampil LB.
    async function getDisplayMode(){try{const r=await fetch('/api/display/mode');const d=await r.json();return d.mode||'game';}catch(_){return 'game';}}
    async function refreshReadyLock(){
      const btn=$('#join-btn');if(!btn)return;
      const mode=await getDisplayMode();
      if(mode==='leaderboard'){
        btn.disabled=true;btn.style.opacity='.45';btn.style.filter='grayscale(1)';
        idleNote('Please wait');
        return true;
      }
      // Unity belum lapor di home (offline / masih loading / lagi main): kunci juga
      try{
        const st=await fetch('/api/queue/state').then(r=>r.json());
        if(!st.unity_home){
          btn.disabled=true;btn.style.opacity='.45';btn.style.filter='grayscale(1)';
          idleNote('Please wait');
          return true;
        }
      }catch(_){}
      {
        if(!btn.querySelector('.btn-spinner')||btn.querySelector('.btn-spinner').style.display!=='inline-block'){btn.disabled=false;btn.style.opacity='';btn.style.filter='';}
        return false;
      }
    }
    function idleNote(t) {
      const el = $('#idle-note');
      if (!el) return;
      el.textContent = t || '';
      el.classList.toggle('show', !!t);
    }
    async function readyToPlay() {
      const btn = $('#join-btn');
      loading(btn, true);
      idleNote('');
      const busyNote = 'Please wait';
      const lockNote = () => 'Please wait';
      const unityNote = 'Please wait';
      try {
        // 1. Admin tampilkan leaderboard di Unity? -> kunci total (howtoplay tidak mengunci)
        const mode = await getDisplayMode();
        if (mode === 'leaderboard') { idleNote(lockNote(mode)); return; }
        const st = await api('/api/queue/state');
        if (st.display_mode === 'leaderboard') { idleNote(lockNote(st.display_mode)); return; }
        // 2. Unity belum di home (lapor via POST /api/unity/home)? -> kunci sampai Unity siap
        if (!st.unity_home) { idleNote(unityNote); return; }
        if (st.current || st.total_waiting > 0) {
          idleNote(busyNote);
          return;
        }
        try {
          await api('/api/queue/join', { method: 'POST' });
        } catch (je) {
          if (je.reason === 'leaderboard' || je.reason === 'howtoplay') { idleNote(lockNote(je.reason)); return; }
          if (je.reason === 'unity-not-ready') { idleNote(unityNote); return; }
          throw je;
        }
        const r = await api('/api/queue/compete', { method: 'POST' });
        if (r.reason === 'leaderboard' || r.reason === 'howtoplay') { idleNote(lockNote(r.reason)); return; }
        if (r.reason === 'unity-not-ready') { idleNote(unityNote); return; }
        if (r.reason === 'playing') {
          try { await api('/api/queue/leave', { method: 'POST' }); } catch (_) { }
          idleNote(busyNote);
          return;
        }
        show('#join-status');
        pollTimer = pollTimer || setInterval(refreshStatus, 3000);
        await refreshStatus();
      } catch (err) {
        // Token mati (401) → jangan tampilkan "Authentication required" mentah:
        // buang sesi, kembalikan ke form nickname dengan pesan yang jelas.
        if (err.status === 401 || /authenticat|expired session|invalid.*session/i.test(err.message || '')) {
          authToken = null; localStorage.removeItem('ct_token');
          show('#alias-wrap');
          const ae = $('#join-alias-error');
          ae.textContent = 'Session expired — please enter your nickname again.';
          ae.classList.add('show');
          return;
        }
        idleNote(/busy|try again later/i.test(err.message || '') ? busyNote : err.message);
      } finally {
        loading(btn, false);
      }
    }

    async function refreshStatus() {
      try {
        const s = await api('/api/queue/my-status');
        if (!s.in_queue) {
          if (s.finished) {
            // Transisi selesai main: langsung ke leaderboard.
            // Buka lagi nanti (scan ulang): ke READY, main lagi nickname sama.
            if (window._lastStatus === 'current' || window._lastStatus === 'waiting') {
              window._lastStatus = 'done';
              location.href = '/scoreboard';
            } else {
              window._lastStatus = 'done';
              showIdle();
            }
          } else {
            window._lastStatus = 'idle';
            showIdle();
          }
          return;
        }
        show('#join-status');
        pollTimer = pollTimer || setInterval(refreshStatus, 3000);
        const title = $('#queue-title');
        const msg = $('#queue-msg');
        $('#queue-name').textContent = (localStorage.getItem('ct_user') || '').toUpperCase() || '–';
        // Sudah READY (waiting/current): selalu pesan arena yang sama,
        // tanpa popup, sampai selesai main -> leaderboard.
        title.innerHTML = `YOU'RE READY!`;
        msg.style.display = '';
        msg.classList.remove('big');
        msg.textContent = 'Please head to the game arena';
        window._lastStatus = s.status;
      } catch (e) {
        // Token mati saat polling: buang sesi, kembali ke form nickname (bukan stuck).
        if (e && e.status === 401) {
          authToken = null; localStorage.removeItem('ct_token');
          clearInterval(pollTimer); pollTimer = null;
          show('#alias-wrap');
        }
      }
    }

    async function showIdle() {
      try {
        const me = await api('/api/profile');
        localStorage.setItem('ct_user', me.username);
        $('#join-welcome').innerHTML = `Welcome<br />${String(me.username).toUpperCase()}!`;
        $('#queue-name').textContent = me.username;
      } catch (_) {}
      show('#join-idle');
      refreshReadyLock();
    }

    (async function boot() {
      setInterval(async () => { if (!$('#join-idle').classList.contains('hidden')) await refreshReadyLock(); }, 3000);
      if (!authToken) { show('#alias-wrap'); return; }
      try {
        const s = await api('/api/queue/my-status');
        if (s.in_queue) {
          show('#join-status');
          pollTimer = setInterval(refreshStatus, 3000);
          await refreshStatus();
        } else {
          // Selesai maupun belum antre: ke tombol READY (main lagi nickname sama).
          // Layar thanks hanya muncul sesaat tepat setelah selesai via polling.
          window._lastStatus = s.finished ? 'done' : 'idle';
          showIdle();
        }
      } catch (_) {
        authToken = null;
        localStorage.removeItem('ct_token');
        show('#alias-wrap');
      }
    })();
  </script>
</body>

</html>
