<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Usher — Pick Player</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="event.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    .now-label {
      font-family: 'Astonpoliz', sans-serif; text-align: center;
      font-size: 13px; letter-spacing: .3em; text-indent: .3em;
      color: rgba(255,255,255,.85);
    }
    .now-name {
      text-align: center; color: #fff; font-weight: 600;
      font-size: 44px; letter-spacing: .02em; margin: 6px 0 2px;
      word-break: break-word;
    }
    .now-sub {
      font-family: 'Astonpoliz', sans-serif; text-align: center;
      color: rgba(255,255,255,.9); font-size: 15px; letter-spacing: .06em;
    }
    .q-head {
      display: flex; align-items: baseline; justify-content: space-between;
      color: #fff; margin-bottom: 10px;
    }
    .q-head h3 { font-size: 20px; letter-spacing: .04em; }
    .q-head h3 span { color: #7cc4ff; }
    .q-row {
      display: flex; align-items: center; gap: 10px;
      background: #fff; border-radius: 999px;
      padding: 8px 8px 8px 18px; margin-top: 8px;
    }
    .q-row .n { color: #e1251b; font-size: 19px; min-width: 44px; }
    .q-row .who { flex: 1; min-width: 0; color: #101010; }
    .q-row .who b { font-size: 18px; letter-spacing: .02em; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .q-row .who span { display: block; font-size: 11px; color: rgba(0,0,0,.5); font-family: 'Astonpoliz', sans-serif; letter-spacing: .06em; }
    .btn-play-q {
      background: #0a2a6e; color: #fff; border: none; border-radius: 50%;
      width: 46px; height: 46px; font-size: 18px; cursor: pointer; flex: none;
      font-family: inherit;
    }
    .btn-play-q:active { transform: scale(.93); }
    .btn-x {
      background: transparent; border: 2px solid rgba(225,37,27,.6); color: #e1251b;
      border-radius: 50%; width: 40px; height: 40px; cursor: pointer; flex: none;
      font-family: inherit; font-size: 15px;
    }
    .q-empty { text-align: center; color: #fff; font-size: 15px; padding: 12px 0; }
    .live-note { text-align: center; font-size: 11px; color: rgba(255,255,255,.6); margin-top: 12px; font-family: 'Astonpoliz', sans-serif; letter-spacing: .08em; }
  </style>
</head>
<body class="ev-body">
  <div class="ev-veil" aria-hidden="true"></div>
  <div class="ev-footwave" aria-hidden="true"><img src="assets/image/footer-wave.png" alt="" /></div>

  <main class="app ev-app">
    <header>
      <p class="ev-symposium">CITI WEALTH SYMPOSIUM</p>
      <img class="ev-title" src="assets/image/title.png" alt="Tennis Challenge" />
      <p class="ev-tagline">PLAY <i>•</i> COMPETE <i>•</i> CONNECT</p>
      <img class="ev-logo" src="assets/image/logo.png" alt="Citi | Mastercard" />
    </header>

    <div class="ev-cols">
    <section class="ev-card">
      <div class="now-label">NOW PLAYING</div>
      <div class="now-name" id="now-name">–</div>
      <div class="now-sub" id="now-sub">–</div>
      <button class="ev-btn" onclick="skip()">SKIP ⏭ NEXT</button>
      <button class="ev-btn" onclick="endGame()" style="background:#e1251b; color:#fff; border-color:#fff; margin-top:10px;">END GAME (TEMP)</button>
    </section>

    <section class="ev-card">
      <div class="q-head"><h3>PLAYERS (<span id="q-count">0</span>)</h3></div>
      <div id="q-list"></div>
      <p class="live-note">TAP ▶ TO PLAY · LIVE · <span id="last-upd"></span></p>
    </section>
    </div>
  </main>

  <div id="toast" class="toast hidden"><span id="toast-text"></span></div>

  <script>
    'use strict';
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    async function api(path, options = {}) {
      const res = await fetch(path, {
        method: options.method || 'GET',
        headers: { 'Content-Type': 'application/json' },
        body: options.body
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error(data.error || 'Request failed');
        err.data = data;
        throw err;
      }
      return data;
    }
    function toast(t, icon='info') {
      Swal.fire({ icon, title: t, confirmButtonColor: '#0a2a6e', timer: 2500, showConfirmButton: false });
    }

    async function refresh() {
      try {
        const s = await api('/api/queue/state');
        if (s.current) {
          $('#now-name').textContent = s.current.display_name || s.current.username;
          $('#now-sub').textContent = 'Playing… 🎾';
        } else {
          $('#now-name').textContent = '–';
          $('#now-sub').textContent = s.total_waiting ? 'Ready to call ↓' : 'No players yet';
        }
        const playersCard = document.querySelector('.q-head').closest('.ev-card');
        if (s.current) {
          $('#q-count').textContent = '—';
          $('#q-list').innerHTML = '<p class="q-empty">Game in progress — please wait until the game finishes.</p>';
          if (playersCard) playersCard.style.opacity = '0.5';
        } else {
          if (playersCard) playersCard.style.opacity = '1';
          $('#q-count').textContent = s.total_waiting;
          $('#q-list').innerHTML = s.waiting.map((w) =>
            `<div class="q-row"><span class="n">#${w.position}</span>` +
            `<span class="who"><b>${esc(w.display_name || w.username)}</b><span>${esc(w.created_at || '')}</span></span>` +
            `<button class="btn-play-q" onclick="pick('${esc(w.username)}')">▶</button>` +
            `<button class="btn-x" onclick="removeQ('${esc(w.username)}')">✕</button></div>`
          ).join('') || '<p class="q-empty">No players yet. Tap PLAY on your phone to compete!</p>';
        }
        $('#last-upd').textContent = 'updated ' + new Date().toLocaleTimeString();
      } catch (e) { Swal.fire({ icon:'error', title:'Error', text:e.message, confirmButtonColor:'#0a2a6e' }); }
    }

    async function pick(username, force) {
      try {
        const r = await api('/api/queue/pick', { method: 'POST', body: JSON.stringify({ username, force: !!force }) });
        toast(`${r.current.user.username} is playing! 🎾`);
      } catch (e) {
        if (e.data && e.data.need_force) {
          const r = await Swal.fire({ icon:'warning', title:'Force switch?', text:e.message, showCancelButton:true, confirmButtonColor:'#0a2a6e', confirmButtonText:'Force switch' });
          if (r.isConfirmed) return pick(username, true);
          return;
        }
        Swal.fire({ icon:'error', title:'Error', text:e.message, confirmButtonColor:'#0a2a6e' });
      }
      refresh();
    }

    async function skip() {
      try {
        const r = await api('/api/queue/next', { method: 'POST' });
        toast(r.current ? `${r.current.user.username} is playing!` : 'No players');
      } catch (e) { Swal.fire({ icon:'error', title:'Error', text:e.message, confirmButtonColor:'#0a2a6e' }); }
      refresh();
    }

    async function removeQ(username) {
      const c = await Swal.fire({ icon:'warning', title:`Remove ${username}?`, text:'Remove player?', showCancelButton:true, confirmButtonColor:'#e1251b' });
      if (!c.isConfirmed) return;
      try {
        await api('/api/admin/queue/remove', { method: 'POST', body: JSON.stringify({ username }) });
      } catch (e) { Swal.fire({ icon:'error', title:'Error', text:e.message, confirmButtonColor:'#0a2a6e' }); }
      refresh();
    }
    async function endGame() {
      const c = await Swal.fire({ icon:'warning', title:'End current game?', text:'Mark current as done (temp)', showCancelButton:true, confirmButtonColor:'#e1251b' });
      if (!c.isConfirmed) return;
      try { await api('/api/admin/end-game', { method:'POST' }); } catch(e){ Swal.fire({ icon:'error', title:'Error', text:e.message, confirmButtonColor:'#0a2a6e' }); }
      refresh();
    }
    async function resetAll() {
      const c = await Swal.fire({ icon:'warning', title:'Reset all?', text:'Clear players & clicks', showCancelButton:true, confirmButtonColor:'#e1251b' });
      if (!c.isConfirmed) return;
      try { await api('/api/admin/reset', { method:'POST' }); toast('Reset done'); } catch(e){ Swal.fire({ icon:'error', title:'Error', text:e.message, confirmButtonColor:'#0a2a6e' }); }
      refresh();
    }

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
